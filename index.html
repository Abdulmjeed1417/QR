<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-lg-6">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">QR Code Generator</h5>
                        <div class="mb-3">
                            <label for="text-input" class="form-label">Text or URL</label>
                            <input type="text" class="form-control" id="text-input" placeholder="Enter text or URL">
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="size-select" class="form-label">Size</label>
                                <select class="form-select" id="size-select">
                                    <option value="200">200x200</option>
                                    <option value="300" selected>300x300</option>
                                    <option value="400">400x400</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="correction-select" class="form-label">Error Correction</label>
                                <select class="form-select" id="correction-select">
                                    <option value="L">Low</option>
                                    <option value="M" selected>Medium</option>
                                    <option value="Q">Quartile</option>
                                    <option value="H">High</option>
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="fg-color-picker" class="form-label">Foreground Color</label>
                                <input type="color" class="form-control form-control-color" id="fg-color-picker" value="#000000">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="bg-color-picker" class="form-label">Background Color</label>
                                <input type="color" class="form-control form-control-color" id="bg-color-picker" value="#ffffff">
                            </div>
                        </div>
                        <div class="d-grid gap-2">
                            <button class="btn btn-primary" id="generate-btn">Generate QR Code</button>
                            <button class="btn btn-success" id="download-btn">Download QR Code</button>
                            <button class="btn btn-secondary" id="copy-btn">Copy to Clipboard</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="card">
                    <div class="card-body text-center">
                        <h5 class="card-title">QR Code Preview</h5>
                        <div id="qrcode-container"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="form-check form-switch mt-3">
            <input class="form-check-input" type="checkbox" id="dark-mode-toggle">
            <label class="form-check-label" for="dark-mode-toggle">Dark Mode</label>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/davidshimjs-qrcodejs@0/qrcode.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
